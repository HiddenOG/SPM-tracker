<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — SPMprocure360</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#8B1A1A;--accent-h:#6E1616;
  --bg:#f0f2f5;--surface:#ffffff;--s2:#f7f8fa;
  --border:#e4e7ec;--border-strong:#d0d5dd;
  --t1:#111827;--t2:#374151;--t3:#6b7280;
  --ok:#16a34a;--warn:#d97706;--crit:#dc2626;
  --radius:8px;--radius-sm:5px;
  --mono:'Courier New',monospace;
  --sb-w:220px;--sb-bg:#1a1a2e;--sb-text:rgba(255,255,255,0.75);
  --sb-active:rgba(255,255,255,0.12);--sb-active-text:#fff;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0f1117;--surface:#1c1f26;--s2:#252830;--border:#2e3340;--border-strong:#3d4354;--t1:#f3f4f6;--t2:#d1d5db;--t3:#9ca3af}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);display:flex;min-height:100vh;font-size:14px}

/* ── Sidebar ── */
.sidebar{width:var(--sb-w);background:var(--sb-bg);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;z-index:20;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 10px;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em}
.sb-bmark{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-sec{font-size:10px;font-weight:600;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.08em;padding:14px 16px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 8px;border-radius:6px;cursor:pointer;color:var(--sb-text);font-size:13px;font-weight:400;text-decoration:none;transition:background .12s,color .12s}
.nav:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav.active{background:var(--sb-active);color:var(--sb-active-text);font-weight:500}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-bottom{margin-top:auto;padding:10px 8px 16px}
.sb-user{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:10px;color:rgba(255,255,255,0.5)}

/* ── Main ── */
.main{margin-left:var(--sb-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:0 1.5rem;height:52px;background:var(--accent);border-bottom:1px solid rgba(0,0,0,0.15);position:sticky;top:0;z-index:10}
.topbar-title{color:#fff;font-size:15px;font-weight:600;flex:1}
.content{padding:1.5rem;flex:1}
.ph{margin-bottom:1.5rem}
.ph-title{font-size:20px;font-weight:700;color:var(--t1);letter-spacing:-.02em}
.ph-sub{font-size:13px;color:var(--t3);margin-top:3px}

/* ── Messages layout ── */
.msg-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

/* Inbox list */
.inbox-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.inbox-hd-title{font-size:13px;font-weight:600;color:var(--t1)}
.inbox-list{display:flex;flex-direction:column}
.msg-row{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative}
.msg-row:last-child{border-bottom:none}
.msg-row:hover{background:var(--s2)}
.msg-row.active{background:var(--s2)}
.msg-row.unread .msg-row-subject{font-weight:600;color:var(--t1)}
.msg-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.msg-row-body{flex:1;min-width:0}
.msg-row-from{font-size:11px;color:var(--t3);margin-bottom:2px}
.msg-row-subject{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-row-preview{font-size:11px;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-row-time{font-size:10px;color:var(--t3);white-space:nowrap;flex-shrink:0;margin-top:3px}
.unread-dot{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--accent)}
.msg-empty{padding:3rem;text-align:center;color:var(--t3);font-size:13px}

/* Message detail */
.msg-detail{display:none}
.msg-detail.open{display:block}
.detail-hd{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.detail-subject{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:8px}
.detail-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t3)}
.detail-meta span b{color:var(--t2);font-weight:500}
.rbadge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;text-transform:capitalize;letter-spacing:.03em;white-space:nowrap}
.rbadge.admin{background:#3b0764;color:#e9d5ff}
.rbadge.procurement{background:#1e3a8a;color:#bfdbfe}
.rbadge.warehouse{background:#78350f;color:#fde68a}
.rbadge.expeditor{background:#064e3b;color:#a7f3d0}
.rbadge.accounts{background:#1f2937;color:#d1fae5}

/* PO summary card */
.po-card{margin:16px 20px;background:var(--s2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.po-card-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.po-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.po-field{display:flex;flex-direction:column;gap:2px}
.po-label{font-size:10px;color:var(--t3);font-weight:500}
.po-value{font-size:13px;color:var(--t1);font-family:var(--mono)}

/* Message body */
.detail-body{padding:16px 20px;font-size:13px;color:var(--t2);line-height:1.6;white-space:pre-wrap;border-bottom:1px solid var(--border)}
.detail-empty{padding:4rem 20px;text-align:center;color:var(--t3);font-size:13px}

/* Reply panel */
.reply-bar{padding:12px 20px;border-top:1px solid var(--border)}
.reply-btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:5px;padding:7px 14px;cursor:pointer;transition:background .12s,color .12s}
.reply-btn:hover{background:var(--accent);color:#fff}
.reply-panel{display:none;padding:14px 20px;border-top:1px solid var(--border);background:var(--s2)}
.reply-panel.open{display:block}
.reply-to-lbl{font-size:11px;color:var(--t3);margin-bottom:6px}
.reply-to-lbl b{color:var(--t2)}
.reply-textarea{width:100%;border:1px solid var(--border);border-radius:5px;padding:9px 11px;font-size:13px;color:var(--t1);background:var(--surface);resize:vertical;min-height:90px;font-family:inherit;margin-bottom:10px}
.reply-textarea:focus{outline:none;border-color:var(--accent)}
.reply-actions{display:flex;gap:8px}
.reply-send{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer}
.reply-send:disabled{opacity:.5;cursor:not-allowed}
.reply-cancel{background:none;border:1px solid var(--border);border-radius:5px;padding:8px 16px;font-size:13px;color:var(--t2);cursor:pointer}
.reply-cancel:hover{background:var(--border)}
.reply-err{font-size:12px;color:#dc2626;margin-top:8px;display:none}

/* Tabs + compose button */
.inbox-tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border)}
.inbox-tab{flex:1;padding:10px 0;font-size:12px;font-weight:600;color:var(--t3);text-align:center;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s;background:none;border-top:none;border-left:none;border-right:none}
.inbox-tab:hover{color:var(--t1)}
.inbox-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.compose-fab{display:flex;align-items:center;gap:7px;margin:12px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;width:calc(100% - 32px);justify-content:center;transition:opacity .12s}
.compose-fab:hover{opacity:.88}
/* Compose panel (inline in messages page) */
.compose-panel{display:none;border-top:1px solid var(--border);padding:16px}
.compose-panel.open{display:block}
.cp-field{margin-bottom:10px}
.cp-label{font-size:11px;font-weight:500;color:var(--t3);margin-bottom:4px}
.cp-input{width:100%;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-size:13px;color:var(--t1);background:var(--surface);font-family:inherit}
.cp-input:focus{outline:none;border-color:var(--accent)}
.cp-select{width:100%;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-size:13px;color:var(--t1);background:var(--surface);height:36px}
.cp-textarea{width:100%;border:1px solid var(--border);border-radius:5px;padding:9px 10px;font-size:13px;color:var(--t1);background:var(--surface);resize:vertical;min-height:100px;font-family:inherit}
.cp-textarea:focus,.cp-select:focus{outline:none;border-color:var(--accent)}
.cp-actions{display:flex;gap:8px;margin-top:4px}
.cp-send{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer}
.cp-send:disabled{opacity:.5;cursor:not-allowed}
.cp-cancel{background:none;border:1px solid var(--border);border-radius:5px;padding:8px 16px;font-size:13px;color:var(--t2);cursor:pointer}
.cp-err{font-size:12px;color:#dc2626;margin-top:8px;display:none}
.cp-attach-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.cp-attach-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:5px;border:1px dashed var(--border);color:var(--t3);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;user-select:none}
.cp-attach-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--s2)}
.cp-attach-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px 4px 9px;border-radius:5px;background:var(--s2);border:1px solid var(--border);font-size:12px;color:var(--t2);max-width:220px}
.cp-attach-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cp-attach-clear{background:none;border:none;cursor:pointer;color:var(--t3);font-size:15px;padding:0 1px;line-height:1;flex-shrink:0}
.cp-attach-clear:hover{color:#dc2626}
/* Type chip */
.type-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:capitalize}
.type-chip.availability_check{background:#fef3c7;color:#92400e}
.type-chip.stock_response{background:#d1fae5;color:#065f46}
.type-chip.dispatch_update{background:#dbeafe;color:#1e40af}
.type-chip.general{background:var(--s2);color:var(--t3)}

/* Thread conversation */
.thread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;background:var(--s2);border:1px solid var(--border);font-size:10px;font-weight:600;color:var(--t3);padding:0 4px;flex-shrink:0;vertical-align:middle;margin-left:3px}
.msg-detail-card{display:flex;flex-direction:column;max-height:calc(100vh - 110px);overflow:hidden}
.msg-detail{display:none;flex-direction:column;flex:1;overflow:hidden}
.msg-detail.open{display:flex}
.thread-hd{padding:16px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.thread-subject{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-meta{font-size:11px;color:var(--t3)}
.thread-body{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:9px;min-height:0}
.thread-msg{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:11px 13px}
.thread-msg.mine{background:rgba(139,26,26,0.05);border-color:rgba(139,26,26,0.22)}
@media(prefers-color-scheme:dark){.thread-msg.mine{background:rgba(139,26,26,0.13);border-color:rgba(139,26,26,0.32)}}
.thread-msg-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.thread-msg-av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.thread-msg-from{font-size:12px;font-weight:600;color:var(--t1)}
.thread-msg-time{font-size:10px;color:var(--t3);margin-left:auto}
.thread-msg-body{font-size:13px;color:var(--t2);line-height:1.6;white-space:pre-wrap}
.thread-msg-attach{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
/* Responsive */
@media(max-width:700px){
  .sidebar{transform:translateX(-100%)}
  .main{margin-left:0}
  .msg-layout{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sb-brand">
    <div class="sb-bmark">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75"><path d="M12 3L2 7.5v9L12 21l10-4.5v-9z"/><path d="M12 12L2 7.5M12 12v9M12 12l10-4.5"/></svg>
    </div>
    SPMprocure360
  </div>

  <div class="sb-sec">Workspace</div>
  <a class="nav" href="/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Dashboard</span>
  </a>
  <a class="nav" href="/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
    <span>Orders</span>
  </a>
  <a class="nav active" href="/messages">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span>Messages</span>
    <span class="badge" id="sb-unread" style="display:none"></span>
  </a>

  <div class="sb-bottom">
    <div class="sb-user">
      <div class="av" id="sb-av">?</div>
      <div style="flex:1;min-width:0">
        <div class="sb-uname" id="sb-uname">—</div>
        <div class="sb-urole" id="sb-urole">—</div>
      </div>
      <button onclick="logout()" title="Sign out" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.5);padding:4px;flex-shrink:0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="main">
  <header class="topbar">
    <div class="topbar-title">Messages</div>
  </header>

  <div class="content">
    <div class="ph">
      <div class="ph-title">Inbox</div>
      <div class="ph-sub" id="inbox-sub">Loading…</div>
    </div>

    <div class="msg-layout">
      <!-- Message list -->
      <div class="card">
        <div class="inbox-hd" style="padding:0 16px;gap:0;align-items:stretch">
          <button class="inbox-tab active" id="tab-received" onclick="switchTab('received')">Received</button>
          <button class="inbox-tab" id="tab-sent" onclick="switchTab('sent')">Sent</button>
          <div style="flex:1"></div>
          <button onclick="openComposePage()" style="align-self:center;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:5px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;margin:8px 0">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Compose
          </button>
        </div>
        <div style="padding:5px 14px 3px"><span id="inbox-count" style="font-size:11px;color:var(--t3)"></span></div>
        <div class="inbox-list" id="inbox-list">
          <div class="msg-empty">Loading…</div>
        </div>
        <!-- Inline compose panel -->
        <div class="compose-panel" id="compose-panel">
          <div class="cp-field">
            <div class="cp-label">To</div>
            <select class="cp-select" id="cp-to">
              <option value="">— Select recipient role —</option>
              <option value="admin">Admin</option>
              <option value="procurement">Procurement</option>
              <option value="warehouse">Warehouse</option>
              <option value="expeditor">Expeditor</option>
              <option value="accounts">Accounts</option>
            </select>
          </div>
          <div class="cp-field">
            <div class="cp-label">Subject</div>
            <input type="text" class="cp-input" id="cp-subject" placeholder="Message subject…">
          </div>
          <div class="cp-field">
            <div class="cp-label">Message</div>
            <textarea class="cp-textarea" id="cp-body" placeholder="Write your message…"></textarea>
          </div>
          <!-- Attachment -->
          <div class="cp-attach-row">
            <label class="cp-attach-btn" for="cp-file-input">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
              Attach file
            </label>
            <input type="file" id="cp-file-input" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.txt" style="display:none" onchange="cpFileChosen(this)">
            <div class="cp-attach-pill" id="cp-attach-pill" style="display:none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span id="cp-attach-name"></span>
              <button class="cp-attach-clear" onclick="clearCpAttach()" aria-label="Remove">&#215;</button>
            </div>
          </div>
          <div class="cp-actions">
            <button class="cp-send" id="cp-send-btn" onclick="sendComposeMsg()">Send</button>
            <button class="cp-cancel" onclick="closeComposePage()">Cancel</button>
          </div>
          <div class="cp-err" id="cp-err"></div>
        </div>
      </div>

      <!-- Thread / conversation detail -->
      <div class="card msg-detail-card">
        <div class="detail-empty" id="detail-empty">Select a conversation to read it</div>
        <div class="msg-detail" id="msg-detail">
          <!-- Thread header -->
          <div class="thread-hd">
            <div class="thread-subject" id="thread-subject"></div>
            <div class="thread-meta" id="thread-meta"></div>
          </div>
          <!-- Conversation messages -->
          <div class="thread-body" id="thread-body"></div>
          <!-- Reply bar -->
          <div class="reply-bar" id="reply-bar" style="flex-shrink:0">
            <button class="reply-btn" onclick="openReply()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>
              Reply
            </button>
          </div>
          <div class="reply-panel" id="reply-panel" style="flex-shrink:0">
            <textarea class="reply-textarea" id="reply-body" placeholder="Write your reply…"></textarea>
            <div class="cp-attach-row">
              <label class="cp-attach-btn" for="reply-file-input">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                Attach file
              </label>
              <input type="file" id="reply-file-input" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.txt" style="display:none" onchange="replyFileChosen(this)">
              <div class="cp-attach-pill" id="reply-attach-pill" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span id="reply-attach-name"></span>
                <button class="cp-attach-clear" onclick="clearReplyAttach()" aria-label="Remove">&#215;</button>
              </div>
            </div>
            <div class="reply-actions">
              <button class="reply-send" id="reply-send-btn" onclick="sendReply()">Send Reply</button>
              <button class="reply-cancel" onclick="closeReply()">Cancel</button>
            </div>
            <div class="reply-err" id="reply-err"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────────────
var _inIframe    = window.parent !== window;
var _authHeader  = sessionStorage.getItem('spm_auth') || '';
var _currentUser = null;
try { _currentUser = JSON.parse(sessionStorage.getItem('spm_user') || 'null'); } catch(e) {}

if (_inIframe) {
  // Hide sidebar — navigation is handled by the parent page
  document.addEventListener('DOMContentLoaded', function() {
    var sb = document.querySelector('.sidebar');
    var tb = document.querySelector('.topbar');
    var mn = document.querySelector('.main');
    if (sb) sb.style.display = 'none';
    if (tb) tb.style.display = 'none';
    if (mn) { mn.style.marginLeft = '0'; }
  });
  // Receive auth from parent via postMessage
  window.addEventListener('message', function(e) {
    if (e.origin !== window.location.origin) return;
    if (e.data && e.data.type === 'spm_auth') {
      _authHeader  = e.data.token || '';
      _currentUser = e.data.user  || null;
      if (_currentUser) initMessages();
    }
  });
} else {
  // Standalone — read sessionStorage directly
  if (!_authHeader || !_currentUser) { window.location.href = '/'; }
  else { document.addEventListener('DOMContentLoaded', initMessages); }
}

function authFetch(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, _authHeader ? {Authorization: _authHeader} : {});
  return fetch(url, opts);
}

function logout() {
  sessionStorage.removeItem('spm_auth');
  sessionStorage.removeItem('spm_user');
  window.location.href = '/';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
var _AV_PAL = ['#7c3aed','#1d4ed8','#0369a1','#047857','#b45309','#9f1239','#0e7490','#4338ca'];
function _avColor(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff;
  return _AV_PAL[h % _AV_PAL.length];
}
function _esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _relTime(iso) {
  if (!iso) return '';
  var diff = Date.now() - new Date(iso).getTime();
  var m = Math.floor(diff / 60000);
  if (m < 2)  return 'Just now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  var d = Math.floor(h / 24);
  if (d < 7)  return d + 'd ago';
  return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// ── Init ──────────────────────────────────────────────────────────────────────
function initMessages() {
  if (!_currentUser) return;
  var name  = _currentUser.name || _currentUser.email || '?';
  var parts = name.trim().split(/\s+/);
  var ini   = parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
  var role  = _currentUser.role || '';
  var sbAv  = document.getElementById('sb-av');
  if (sbAv) sbAv.textContent = ini;
  var sbName = document.getElementById('sb-uname');
  if (sbName) sbName.textContent = name;
  var sbRole = document.getElementById('sb-urole');
  if (sbRole) sbRole.textContent = role.charAt(0).toUpperCase() + role.slice(1);
  var sub = document.getElementById('inbox-sub');
  if (sub) sub.textContent = 'Showing messages for ' + role + ' role';
  loadMessages();
}

// ── Messages ──────────────────────────────────────────────────────────────────
var THREADS         = [];
var _openThreadId   = null;
var _openThreadMsgs = [];
var _activeTab      = 'received';

function switchTab(tab) {
  _activeTab = tab;
  document.getElementById('tab-received').classList.toggle('active', tab === 'received');
  document.getElementById('tab-sent').classList.toggle('active', tab === 'sent');
  document.getElementById('compose-panel').classList.remove('open');
  _openThreadId = null;
  _openThreadMsgs = [];
  document.getElementById('detail-empty').style.display = '';
  var detail = document.getElementById('msg-detail');
  if (detail) detail.classList.remove('open');
  loadMessages();
}

async function loadMessages() {
  try {
    var role = _currentUser ? _currentUser.role : '';
    var url  = _activeTab === 'sent'
      ? '/api/messages/sent'
      : '/api/messages?role=' + encodeURIComponent(role);
    var res = await authFetch(url);
    if (!res.ok) return;
    var data = await res.json();
    THREADS = Array.isArray(data) ? data : (data.data || []);
    renderInbox();
  } catch(e) { console.error('loadMessages:', e); }
}

function renderInbox() {
  var list   = document.getElementById('inbox-list');
  var count  = document.getElementById('inbox-count');
  var isSent = _activeTab === 'sent';
  var unread = isSent ? 0 : THREADS.reduce(function(s, t) { return s + (t.unread_count || 0); }, 0);
  if (count) count.textContent = THREADS.length + ' thread' + (THREADS.length !== 1 ? 's' : '') + (unread ? ' · ' + unread + ' unread' : '');
  var badge = document.getElementById('sb-unread');
  if (badge) { badge.textContent = unread; badge.style.display = unread ? '' : 'none'; }
  if (!THREADS.length) {
    list.innerHTML = '<div class="msg-empty">' + (isSent ? 'No sent messages yet' : 'No messages yet') + '</div>';
    return;
  }
  list.innerHTML = THREADS.map(function(t) {
    var displayName = isSent ? ('To: ' + (t.latest_to_role || '—')) : (t.latest_from || '—');
    var ini   = displayName.split(' ').map(function(w){ return w[0]||''; }).slice(0,2).join('').toUpperCase() || '?';
    var color = _avColor(displayName + t.thread_id);
    var isActive  = _openThreadId === t.thread_id;
    var hasUnread = !isSent && (t.unread_count > 0);
    var countBadge = t.message_count > 1 ? '<span class="thread-badge">' + t.message_count + '</span>' : '';
    return '<div class="msg-row' + (hasUnread ? ' unread' : '') + (isActive ? ' active' : '') + '" onclick="openThread(\'' + _esc(t.thread_id) + '\')">'
      + (hasUnread ? '<div class="unread-dot"></div>' : '')
      + '<div class="msg-av" style="background:' + color + '">' + _esc(ini) + '</div>'
      + '<div class="msg-row-body">'
      +   '<div class="msg-row-from" style="display:flex;align-items:center;gap:4px">' + _esc(displayName) + countBadge + '</div>'
      +   '<div class="msg-row-subject">' + _esc(t.subject || '(no subject)') + '</div>'
      +   '<div class="msg-row-preview">' + _esc((t.latest_body || '').slice(0, 80)) + '</div>'
      + '</div>'
      + '<div class="msg-row-time">' + _relTime(t.latest_at) + '</div>'
      + '</div>';
  }).join('');
}

async function openThread(threadId) {
  _openThreadId = threadId;
  // Highlight active row
  var rows = document.querySelectorAll('.msg-row');
  rows.forEach(function(r, i) {
    r.classList.toggle('active', THREADS[i] && THREADS[i].thread_id === threadId);
  });

  document.getElementById('detail-empty').style.display = 'none';
  var detail = document.getElementById('msg-detail');
  detail.classList.add('open');
  document.getElementById('thread-body').innerHTML = '<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px">Loading…</div>';
  document.getElementById('thread-subject').textContent = '';
  document.getElementById('thread-meta').textContent = '';
  closeReply();

  try {
    var res = await authFetch('/api/messages/thread/' + encodeURIComponent(threadId));
    if (!res.ok) throw new Error();
    var data = await res.json();
    _openThreadMsgs = Array.isArray(data) ? data : (data.data || []);
    renderThread(_openThreadMsgs);

    // Clear unread for this thread in the local list
    var t = THREADS.find(function(x) { return x.thread_id === threadId; });
    if (t) { t.unread_count = 0; renderInbox(); }

    // Hide reply bar for sent-only threads
    var replyBar = document.getElementById('reply-bar');
    if (replyBar) replyBar.style.display = _activeTab === 'sent' ? 'none' : '';
  } catch(e) {
    document.getElementById('thread-body').innerHTML = '<div style="padding:20px;text-align:center;color:var(--crit);font-size:13px">Could not load conversation.</div>';
  }
}

function renderThread(msgs) {
  var userId = _currentUser ? _currentUser.id : null;
  if (!msgs.length) {
    document.getElementById('thread-body').innerHTML = '<div style="padding:20px;text-align:center;color:var(--t3)">No messages</div>';
    return;
  }
  var subject = msgs[0].subject || '(no subject)';
  document.getElementById('thread-subject').textContent = subject;
  document.getElementById('thread-meta').textContent = msgs.length + ' message' + (msgs.length !== 1 ? 's' : '');

  // Set _replyToMsg to the latest message the current user did NOT send
  var received = msgs.filter(function(m) { return m.from_user_id !== userId; });
  _replyToMsg = received.length ? received[received.length - 1] : msgs[msgs.length - 1];

  var VALID_ROLES = ['admin','procurement','warehouse','expeditor','accounts'];
  document.getElementById('thread-body').innerHTML = msgs.map(function(m) {
    var isMine = m.from_user_id === userId;
    var from   = isMine ? 'You' : (m.from_name || 'Unknown');
    var role   = m.from_role || '';
    var ini    = from.split(' ').map(function(w){ return w[0]||''; }).slice(0,2).join('').toUpperCase() || '?';
    var color  = _avColor(from + (m.from_user_id || ''));
    var roleTag = role
      ? '<span class="rbadge ' + (VALID_ROLES.indexOf(role) >= 0 ? _esc(role) : '') + '" style="font-size:9px;padding:2px 6px">' + _esc(role) + '</span>'
      : '';
    var attachHtml = '';
    if (m.attachment_url) {
      attachHtml = '<div class="thread-msg-attach">'
        + '<a href="' + _esc(m.attachment_url) + '" target="_blank" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;padding:6px 12px;border:1px solid var(--accent);border-radius:4px">'
        + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>'
        + _esc(m.attachment_name || 'Attachment') + '</a></div>';
    }
    return '<div class="thread-msg' + (isMine ? ' mine' : '') + '">'
      + '<div class="thread-msg-hd">'
      + '<div class="thread-msg-av" style="background:' + color + '">' + _esc(ini) + '</div>'
      + '<span class="thread-msg-from">' + _esc(from) + '</span>'
      + roleTag
      + '<span class="thread-msg-time">' + _relTime(m.created_at) + '</span>'
      + '</div>'
      + '<div class="thread-msg-body">' + _esc(m.body || '') + '</div>'
      + attachHtml
      + '</div>';
  }).join('');

  // Scroll to latest message
  var tb = document.getElementById('thread-body');
  tb.scrollTop = tb.scrollHeight;
}

// ── Reply ─────────────────────────────────────────────────────────────────────
var _replyToMsg    = null;
var _replyAttachFile = null;

function replyFileChosen(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    alert('File is too large — maximum is 10 MB.');
    input.value = '';
    return;
  }
  _replyAttachFile = file;
  document.getElementById('reply-attach-name').textContent = file.name;
  document.getElementById('reply-attach-pill').style.display = '';
}

function clearReplyAttach() {
  _replyAttachFile = null;
  var inp = document.getElementById('reply-file-input');
  if (inp) inp.value = '';
  document.getElementById('reply-attach-pill').style.display = 'none';
}

function openReply() {
  document.getElementById('reply-body').value = '';
  document.getElementById('reply-err').style.display = 'none';
  clearReplyAttach();
  document.getElementById('reply-panel').classList.add('open');
  document.getElementById('reply-bar').style.display = 'none';
  document.getElementById('reply-body').focus();
}

function closeReply() {
  document.getElementById('reply-panel').classList.remove('open');
  document.getElementById('reply-bar').style.display = '';
  clearReplyAttach();
}

async function sendReply() {
  if (!_replyToMsg || !_openThreadId) return;
  var m     = _replyToMsg;
  var body  = document.getElementById('reply-body').value.trim();
  var errEl = document.getElementById('reply-err');
  var btn   = document.getElementById('reply-send-btn');
  errEl.style.display = 'none';
  if (!body) { errEl.textContent = 'Reply cannot be empty.'; errEl.style.display = ''; return; }
  if (!m.from_role) { errEl.textContent = 'Cannot determine who to reply to.'; errEl.style.display = ''; return; }
  btn.disabled = true;
  try {
    var attachUrl = null, attachName = null;
    if (_replyAttachFile) {
      btn.textContent = 'Uploading…';
      var fd = new FormData();
      fd.append('file', _replyAttachFile, _replyAttachFile.name);
      var upRes  = await authFetch('/api/messages/upload', {method: 'POST', body: fd});
      var upData = await upRes.json();
      if (!upRes.ok) throw new Error((upData && upData.detail) || 'File upload failed');
      var ud  = (upData && upData.data) || upData;
      attachUrl  = ud.url;
      attachName = ud.name;
    }
    btn.textContent = 'Sending…';
    var subj = (m.subject || '');
    if (!subj.match(/^Re:/i)) subj = 'Re: ' + subj;
    var res = await authFetch('/api/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        to_role:         m.from_role,
        subject:         subj,
        body:            body,
        message_type:    'stock_response',
        order_id:        m.order_id     || null,
        order_client:    m.order_client || null,
        thread_id:       _openThreadId,
        attachment_url:  attachUrl  || undefined,
        attachment_name: attachName || undefined,
      }),
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    closeReply();
    await openThread(_openThreadId);
  } catch(e) {
    errEl.textContent = e.message || 'Could not send reply.';
    errEl.style.display = '';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Reply';
  }
}

// ── Compose (inline panel) ────────────────────────────────────────────────────
function openComposePage() {
  var panel = document.getElementById('compose-panel');
  var isOpen = panel.classList.contains('open');
  if (isOpen) { closeComposePage(); return; }
  document.getElementById('cp-to').value = '';
  document.getElementById('cp-subject').value = '';
  document.getElementById('cp-body').value = '';
  document.getElementById('cp-err').style.display = 'none';
  clearCpAttach();
  panel.classList.add('open');
  document.getElementById('cp-to').focus();
}

var _cpAttachFile = null;

function cpFileChosen(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    alert('File too large — maximum is 10 MB.');
    input.value = '';
    return;
  }
  _cpAttachFile = file;
  document.getElementById('cp-attach-name').textContent = file.name;
  document.getElementById('cp-attach-pill').style.display = '';
}

function clearCpAttach() {
  _cpAttachFile = null;
  var inp = document.getElementById('cp-file-input');
  if (inp) inp.value = '';
  document.getElementById('cp-attach-pill').style.display = 'none';
  document.getElementById('cp-attach-name').textContent = '';
}

function closeComposePage() {
  document.getElementById('compose-panel').classList.remove('open');
  clearCpAttach();
}

async function sendComposeMsg() {
  var toRole  = document.getElementById('cp-to').value.trim();
  var subject = document.getElementById('cp-subject').value.trim();
  var body    = document.getElementById('cp-body').value.trim();
  var errEl   = document.getElementById('cp-err');
  var btn     = document.getElementById('cp-send-btn');
  errEl.style.display = 'none';
  if (!toRole)  { errEl.textContent = 'Please select a recipient.'; errEl.style.display = ''; return; }
  if (!subject) { errEl.textContent = 'Subject cannot be empty.'; errEl.style.display = ''; return; }
  if (!body)    { errEl.textContent = 'Message cannot be empty.'; errEl.style.display = ''; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  var attachUrl = null, attachName = null;
  try {
    if (_cpAttachFile) {
      btn.textContent = 'Uploading file…';
      var fd = new FormData();
      fd.append('file', _cpAttachFile, _cpAttachFile.name);
      var upRes  = await authFetch('/api/messages/upload', {method: 'POST', body: fd});
      var upData = await upRes.json();
      if (!upRes.ok) throw new Error((upData && upData.detail) || 'File upload failed');
      var ud = (upData && upData.data) || upData;
      attachUrl  = ud.url;
      attachName = ud.name;
      btn.textContent = 'Sending…';
    }
    var res = await authFetch('/api/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        to_role: toRole, subject: subject, body: body, message_type: 'general',
        attachment_url:  attachUrl  || undefined,
        attachment_name: attachName || undefined,
      }),
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    closeComposePage();
    switchTab('sent');
  } catch(e) {
    errEl.textContent = e.message || 'Could not send message.';
    errEl.style.display = '';
  } finally {
    btn.disabled = false; btn.textContent = 'Send';
  }
}

</script>
</body>
</html>
